<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Featured systems project grid</title>
  <desc id="desc">A premium dashboard grid highlighting six projects: TradeMind, Orbit, F.R.I.D.A.Y, XAUUSD Algo Lab, Portfolio, and RepForge.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.5" stop-color="#071426"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="0" y1="0" x2="360" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.7"/>
      <stop offset="0.52" stop-color="#14B8A6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.48"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#38BDF8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .font { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .mono { font-family: Fira Code, JetBrains Mono, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="560" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="560" rx="24" fill="url(#grid)"/>
  <circle cx="1115" cy="88" r="170" fill="#22D3EE" fill-opacity="0.10"/>
  <circle cx="156" cy="502" r="190" fill="#8B5CF6" fill-opacity="0.08"/>

  <text class="mono" x="70" y="72" fill="#67E8F9" font-size="16" letter-spacing="2">FEATURED SYSTEMS / PRODUCT GRID</text>
  <text class="font" x="70" y="114" fill="#F8FAFC" font-size="36" font-weight="800">Command modules built around real workflows</text>
  <text class="font" x="70" y="148" fill="#94A3B8" font-size="18">AI SaaS, trading intelligence, local-first assistants, and shipped product interfaces.</text>

  <g transform="translate(70 190)">
    <g>
      <rect x="0" y="0" width="360" height="124" rx="18" fill="#07111D" fill-opacity="0.9" stroke="url(#cardStroke)"/>
      <text class="font" x="24" y="38" fill="#F8FAFC" font-size="24" font-weight="800">TradeMind</text>
      <text class="font" x="24" y="70" fill="#94A3B8" font-size="15">Trading psychology and discipline engine</text>
      <rect x="24" y="88" width="92" height="22" rx="11" fill="#0B253A"/>
      <text class="mono" x="38" y="104" fill="#67E8F9" font-size="11">AI SaaS</text>
      <circle cx="330" cy="32" r="7" fill="#22D3EE" filter="url(#glow)">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(410 0)">
      <rect x="0" y="0" width="360" height="124" rx="18" fill="#07111D" fill-opacity="0.9" stroke="url(#cardStroke)"/>
      <text class="font" x="24" y="38" fill="#F8FAFC" font-size="24" font-weight="800">Orbit</text>
      <text class="font" x="24" y="70" fill="#94A3B8" font-size="15">Operations command center for services</text>
      <rect x="24" y="88" width="112" height="22" rx="11" fill="#072D2A"/>
      <text class="mono" x="38" y="104" fill="#5EEAD4" font-size="11">Automation</text>
      <circle cx="330" cy="32" r="7" fill="#14B8A6" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.35;1" dur="3.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(820 0)">
      <rect x="0" y="0" width="360" height="124" rx="18" fill="#07111D" fill-opacity="0.9" stroke="url(#cardStroke)"/>
      <text class="font" x="24" y="38" fill="#F8FAFC" font-size="24" font-weight="800">F.R.I.D.A.Y</text>
      <text class="font" x="24" y="70" fill="#94A3B8" font-size="15">Local-first assistant and agent workflows</text>
      <rect x="24" y="88" width="108" height="22" rx="11" fill="#141B3B"/>
      <text class="mono" x="38" y="104" fill="#C4B5FD" font-size="11">AI Agents</text>
      <circle cx="330" cy="32" r="7" fill="#8B5CF6" filter="url(#glow)">
        <animate attributeName="opacity" values="0.45;1;0.45" dur="3.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(0 160)">
      <rect x="0" y="0" width="360" height="124" rx="18" fill="#07111D" fill-opacity="0.9" stroke="url(#cardStroke)"/>
      <text class="font" x="24" y="38" fill="#F8FAFC" font-size="24" font-weight="800">XAUUSD Algo Lab</text>
      <text class="font" x="24" y="70" fill="#94A3B8" font-size="15">Backtesting and market-structure research</text>
      <rect x="24" y="88" width="128" height="22" rx="11" fill="#0B253A"/>
      <text class="mono" x="38" y="104" fill="#67E8F9" font-size="11">Strategy R&amp;D</text>
      <circle cx="330" cy="32" r="7" fill="#38BDF8" filter="url(#glow)">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(410 160)">
      <rect x="0" y="0" width="360" height="124" rx="18" fill="#07111D" fill-opacity="0.9" stroke="url(#cardStroke)"/>
      <text class="font" x="24" y="38" fill="#F8FAFC" font-size="24" font-weight="800">Portfolio</text>
      <text class="font" x="24" y="70" fill="#94A3B8" font-size="15">Product identity and interface direction</text>
      <rect x="24" y="88" width="88" height="22" rx="11" fill="#072D2A"/>
      <text class="mono" x="38" y="104" fill="#5EEAD4" font-size="11">Frontend</text>
      <circle cx="330" cy="32" r="7" fill="#14B8A6" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.35;1" dur="4.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(820 160)">
      <rect x="0" y="0" width="360" height="124" rx="18" fill="#07111D" fill-opacity="0.9" stroke="url(#cardStroke)"/>
      <text class="font" x="24" y="38" fill="#F8FAFC" font-size="24" font-weight="800">RepForge</text>
      <text class="font" x="24" y="70" fill="#94A3B8" font-size="15">Hypertrophy planning and workout execution</text>
      <rect x="24" y="88" width="90" height="22" rx="11" fill="#141B3B"/>
      <text class="mono" x="38" y="104" fill="#C4B5FD" font-size="11">Fitness UI</text>
      <circle cx="330" cy="32" r="7" fill="#8B5CF6" filter="url(#glow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="4.6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <path d="M249 314H249C249 338 273 350 296 350H453" stroke="#22D3EE" stroke-opacity="0.22" stroke-dasharray="8 10">
    <animate attributeName="stroke-dashoffset" values="0;-72" dur="6s" repeatCount="indefinite"/>
  </path>
  <path d="M660 314V332C660 344 670 354 682 354H857" stroke="#14B8A6" stroke-opacity="0.2" stroke-dasharray="8 10">
    <animate attributeName="stroke-dashoffset" values="0;-72" dur="6.8s" repeatCount="indefinite"/>
  </path>
</svg>
