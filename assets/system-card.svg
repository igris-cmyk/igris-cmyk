<svg width="1280" height="340" viewBox="0 0 1280 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">System boot identity panel</title>
  <desc id="desc">Terminal-inspired identity panel showing Sahil Khursheed's build mode, focus areas, and active systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.55" stop-color="#071426"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="edge" x1="52" y1="42" x2="1228" y2="308" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.72"/>
      <stop offset="0.5" stop-color="#14B8A6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.48"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#38BDF8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .font { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .mono { font-family: Fira Code, JetBrains Mono, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="24" fill="url(#grid)"/>
  <rect x="52" y="42" width="1176" height="256" rx="22" fill="#07111D" fill-opacity="0.88" stroke="url(#edge)"/>

  <g transform="translate(82 72)">
    <circle cx="10" cy="10" r="5" fill="#22D3EE"/>
    <circle cx="32" cy="10" r="5" fill="#14B8A6"/>
    <circle cx="54" cy="10" r="5" fill="#8B5CF6"/>
    <text class="mono" x="82" y="16" fill="#67E8F9" font-size="14">IDENTITY BOOT SEQUENCE</text>
  </g>

  <g transform="translate(90 94)">
    <text class="mono" x="0" y="0" fill="#64748B" font-size="15">$ whoami</text>
    <text class="font" x="0" y="38" fill="#F8FAFC" font-size="30" font-weight="800">Sahil Khursheed</text>

    <text class="mono" x="0" y="88" fill="#64748B" font-size="15">$ system.status</text>
    <text class="font" x="0" y="126" fill="#C4F1FF" font-size="24" font-weight="700">Full-Stack Developer &amp; AI Builder</text>

    <text class="mono" x="0" y="154" fill="#64748B" font-size="15">$ focus --current</text>
    <text class="font" x="0" y="190" fill="#CBD5E1" font-size="20">AI SaaS | Trading Systems | Local-first AI | Product Execution</text>
  </g>

  <g transform="translate(735 90)">
    <rect x="0" y="0" width="408" height="158" rx="18" fill="#020617" fill-opacity="0.78" stroke="#22D3EE" stroke-opacity="0.26"/>
    <text class="mono" x="26" y="38" fill="#94A3B8" font-size="14">build_mode:</text>
    <text class="mono" x="138" y="38" fill="#5EEAD4" font-size="14">always_shipping</text>
    <text class="mono" x="26" y="72" fill="#94A3B8" font-size="14">current_systems:</text>
    <text class="mono" x="48" y="104" fill="#E2E8F0" font-size="14">- TradeMind / psychology engine</text>
    <text class="mono" x="48" y="132" fill="#E2E8F0" font-size="14">- Orbit / operations command</text>
  </g>

  <g transform="translate(1180 76)" filter="url(#glow)">
    <circle cx="0" cy="0" r="5" fill="#22D3EE">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <path d="M1050 268H1128C1154 268 1168 244 1168 222V170" stroke="#22D3EE" stroke-opacity="0.36" stroke-width="2" stroke-dasharray="6 8">
    <animate attributeName="stroke-dashoffset" values="0;-56" dur="5s" repeatCount="indefinite"/>
  </path>
</svg>
