<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sahil Khursheed developer command center hero</title>
  <desc id="desc">A dark futuristic command center banner for Sahil Khursheed, Full-Stack Developer and AI Builder.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.48" stop-color="#071426"/>
      <stop offset="1" stop-color="#02111F"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(972 98) rotate(135) scale(440 250)">
      <stop stop-color="#22D3EE" stop-opacity="0.52"/>
      <stop offset="0.45" stop-color="#14B8A6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(202 340) rotate(-22) scale(380 160)">
      <stop stop-color="#8B5CF6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="84" y1="88" x2="1194" y2="354" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#07111D" stop-opacity="0.58"/>
    </linearGradient>
    <linearGradient id="stroke" x1="80" y1="72" x2="1200" y2="358" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.72"/>
      <stop offset="0.52" stop-color="#14B8A6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.48"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#38BDF8" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-40%" width="140%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.132 0 0 0 0 0.827 0 0 0 0 0.933 0 0 0 0.82 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .font { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .mono { font-family: Fira Code, JetBrains Mono, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="28" fill="url(#cyanGlow)"/>
  <rect width="1280" height="420" rx="28" fill="url(#violetGlow)"/>

  <path d="M68 318C174 290 209 222 310 224C399 226 430 283 525 264C626 244 653 138 754 123C866 106 932 202 1038 178C1098 165 1144 127 1199 84" stroke="#22D3EE" stroke-opacity="0.24" stroke-width="2"/>
  <path d="M68 318C174 290 209 222 310 224C399 226 430 283 525 264C626 244 653 138 754 123C866 106 932 202 1038 178C1098 165 1144 127 1199 84" stroke="#22D3EE" stroke-width="2" stroke-dasharray="80 960" filter="url(#softGlow)">
    <animate attributeName="stroke-dashoffset" values="0;-1040" dur="9s" repeatCount="indefinite"/>
  </path>

  <rect x="64" y="58" width="1152" height="304" rx="24" fill="url(#panel)" stroke="url(#stroke)" stroke-opacity="0.78"/>
  <rect x="88" y="82" width="1104" height="256" rx="18" stroke="#38BDF8" stroke-opacity="0.11"/>

  <g opacity="0.9">
    <circle cx="111" cy="107" r="6" fill="#22D3EE"/>
    <circle cx="135" cy="107" r="6" fill="#14B8A6"/>
    <circle cx="159" cy="107" r="6" fill="#8B5CF6"/>
  </g>

  <g transform="translate(114 146)">
    <text class="mono" x="0" y="0" fill="#67E8F9" font-size="17" letter-spacing="2">SAHIL.OS / PROFILE COMMAND</text>
    <text class="font" x="0" y="70" fill="#F8FAFC" font-size="64" font-weight="800">Sahil Khursheed</text>
    <text class="font" x="2" y="116" fill="#C4F1FF" font-size="28" font-weight="700">Full-Stack Developer &amp; AI Builder</text>
    <text class="font" x="2" y="162" fill="#94A3B8" font-size="22">From idea to deployed product.</text>
    <g transform="translate(2 194)">
      <rect x="0" y="0" width="206" height="34" rx="17" fill="#071B2F" stroke="#22D3EE" stroke-opacity="0.46"/>
      <text class="mono" x="18" y="23" fill="#22D3EE" font-size="14">AI SaaS</text>
      <rect x="222" y="0" width="216" height="34" rx="17" fill="#071B2F" stroke="#14B8A6" stroke-opacity="0.46"/>
      <text class="mono" x="240" y="23" fill="#5EEAD4" font-size="14">Trading Systems</text>
      <rect x="454" y="0" width="242" height="34" rx="17" fill="#071B2F" stroke="#818CF8" stroke-opacity="0.46"/>
      <text class="mono" x="472" y="23" fill="#C4B5FD" font-size="14">Local-first AI</text>
    </g>
  </g>

  <g transform="translate(800 112)">
    <rect x="0" y="0" width="332" height="192" rx="18" fill="#020617" fill-opacity="0.7" stroke="#22D3EE" stroke-opacity="0.34"/>
    <rect x="20" y="20" width="292" height="38" rx="10" fill="#0B253A" stroke="#22D3EE" stroke-opacity="0.22"/>
    <text class="mono" x="38" y="45" fill="#67E8F9" font-size="14">$ boot identity --live</text>
    <text class="mono" x="24" y="88" fill="#94A3B8" font-size="13">systems.online</text>
    <rect x="148" y="76" width="142" height="16" rx="8" fill="#082F49"/>
    <rect x="148" y="76" width="112" height="16" rx="8" fill="#22D3EE" opacity="0.78">
      <animate attributeName="width" values="72;128;112" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <text class="mono" x="24" y="122" fill="#94A3B8" font-size="13">shipping.loop</text>
    <rect x="148" y="110" width="142" height="16" rx="8" fill="#082F49"/>
    <rect x="148" y="110" width="124" height="16" rx="8" fill="#14B8A6" opacity="0.72">
      <animate attributeName="width" values="88;136;124" dur="5.2s" repeatCount="indefinite"/>
    </rect>
    <text class="mono" x="24" y="156" fill="#94A3B8" font-size="13">workflow.signal</text>
    <rect x="148" y="144" width="142" height="16" rx="8" fill="#082F49"/>
    <rect x="148" y="144" width="98" height="16" rx="8" fill="#8B5CF6" opacity="0.68">
      <animate attributeName="width" values="68;118;98" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(936 286)" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="5" fill="#22D3EE">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="82" cy="-42" r="4" fill="#14B8A6">
      <animate attributeName="opacity" values="1;0.35;1" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="158" cy="-4" r="5" fill="#8B5CF6">
      <animate attributeName="opacity" values="0.4;0.95;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="64" y="58" width="1152" height="304" rx="24" stroke="#E0F2FE" stroke-opacity="0.08"/>
</svg>
